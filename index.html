<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mohamad Arafan | Full-Stack MERN Developer</title>
    <meta
      name="description"
      content="Portfolio of Mohamad Arafan, a Full-Stack Developer specializing in MERN stack web development, React.js, Node.js, Express.js, and MongoDB."
    />
    <meta name="author" content="Mohamad Arafan" />
    <meta name="theme-color" content="#0d1424" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohamad Arafan | Full-Stack MERN Developer" />
    <meta
      property="og:description"
      content="Portfolio of Mohamad Arafan, a Full-Stack Developer specializing in MERN stack web development, React.js, Node.js, Express.js, and MongoDB."
    />
    <meta name="twitter:card" content="summary" />
    <!--
      After you deploy, add these two tags with your real values:
      <meta property="og:url" content="https://your-domain.com" />
      <meta property="og:image" content="https://your-domain.com/og-image.png" />
    -->

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
